<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRealizr — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a2e;
      color: #e8dcc8;
      font-family: serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    h1 { font-size: 2rem; color: #c5a059; margin-bottom: 1rem; letter-spacing: 0.1em; }
    p  { color: #9ca3af; font-size: 1rem; line-height: 1.6; max-width: 36ch; margin: 0 auto; }
    .retry {
      margin-top: 2rem;
      display: inline-block;
      padding: 0.75rem 2rem;
      background: #6c63ff;
      color: #fff;
      border-radius: 4px;
      text-decoration: none;
      font-family: sans-serif;
      font-size: 0.875rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div>
    <h1>You&#39;re Offline</h1>
    <p>CRealizr needs a connection to load for the first time. Once visited, all tools work offline.</p>
    <a class="retry" href="/">Try Again</a>
  </div>
</body>
</html>
